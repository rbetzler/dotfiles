[settings]
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ['--seed'] }
SOPS_AGE_KEY_FILE = "~/.config/sops/age/keys.txt"
FNOX_AGE_KEY_FILE = "~/.config/sops/age/keys.txt"

BUILDX_BAKE_ENTITLEMENTS_FS = "0"
FNOX_SHELL_OUTPUT = "none"

[tools]
age = "latest"
argo = "latest"
argocd = "latest"
aws = "latest"
bat = "latest"
bitwarden = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fnox = "latest"
fzf = "latest"
gcloud = "latest"
gh = "latest"
glow = "latest"
jq = "latest"
kubectl = "latest"
helm = "latest"
pandoc = "latest"
pulumi = "latest"
python = "3.13"
sd = "latest"
sops = "latest"
usage = "latest"
uv = "0.11"
yazi = "latest"
yq = "latest"

[tasks."python:install"]
run = [
  "uv sync",
]
