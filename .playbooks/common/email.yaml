---
- hosts: localhost
  connection: local
  tasks:
    - name: Install email
      when: ansible_facts["distribution"] == "Archlinux"
      become: true
      community.general.pacman:
        state: present
        name:
          - isync
          - neomutt
    - name: Install email
      when: ansible_facts["distribution"] == "Archlinux"
      kewlfft.aur.aur:
        use: yay
        name:
          - cyrus-sasl-xoauth2-git
          - oama-bin
    - name: Configure email utils
      ansible.builtin.copy:
        content: "{{ lookup('community.sops.sops', item.src_file, rstrip=false) }}"
        dest: '{{ item.dest_file }}'
        mode: 0644
      with_items:
        - src_file: ~/.encrypted/mbsyncrc.enc
          dest_file: '{{ ansible_env.HOME }}/.mbsyncrc'
        - src_file: ~/.encrypted/oama.enc.yaml
          dest_file: '{{ ansible_env.HOME }}/.config/oama/config.yaml'
    - name: Setup email sync cron
      ansible.builtin.cron:
        name: sync emails
        minute: "*/5"
        job: /usr/bin/mbsync --config /home/rlb/.mbsyncrc email
    - name: Enable, start cronie.service
      when: ansible_facts["distribution"] == "Archlinux"
      become: true
      ansible.builtin.systemd_service:
        name: cronie.service
        enabled: true
        state: started
