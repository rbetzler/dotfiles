# Preinstall
# 1. Install homebrew
#    ```
#    sudo apt install --yes curl
#    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
#    echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv bash)"' >> ~/.bashrc
#    ```
# 2. Optional. Install, start ssh server
#    ```
#    sudo apt update
#    sudo apt install --yes openssh-server
#    sudo systemctl enable ssh
#    sudo systemctl start ssh
#    ```
---
- hosts: localhost
  tasks:
    - name: Install global requirements
      become: true
      ansible.builtin.apt:
        state: present
        name:
          - apt-transport-https
          - build-essential
          - ca-certificates
          - git
          - less
          - openssh-server
          - wget
    - name: Install client tooling
      tags:
        - client
      become: true
      ansible.builtin.apt:
        state: present
        name:
          - bind9
          - copyq
          - dpkg
          - gawk
          - gparted
          - htop
          - nodejs
          - npm
          - pwgen
          - tk
          - tre-command
          - tree
          - unzip
    - name: Install homebrew packages
      homebrew:
        state: present
        update_homebrew: yes
        name:
          # - autojump
          # - gcc
          - mise
          # - pyenv
          # - vgrep
    - name: Enable, restart ssh server
      tags:
        - server
      become: true
      ansible.builtin.systemd_service:
        name: sshd.service
        enabled: false
        state: restarted
    - name: Write bashrc
      tags:
        - server
      ansible.builtin.copy:
        dest: ~/.bashrc
        content: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          eval "$(mise activate bash)"
    - name: Write mise toml
      tags:
        - server
      ansible.builtin.copy:
        dest: ~/mise.local.toml
        content: |
          [tools]
          age = "latest"
          fnox = "latest"
          sops = "latest"
